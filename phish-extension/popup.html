<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScamShield - AI Phishing Detection</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #FF6B6B;
            --primary-dark: #FF5252;
            --success: #51CF66;
            --warning: #FFD93D;
            --danger: #FF1744;
            --dark-bg: #0F1419;
            --card-bg: #1A1F2E;
            --border: #2D3748;
            --text-primary: #FFFFFF;
            --text-secondary: #B0B8C1;
            --gradient: linear-gradient(135deg, #FF6B6B 0%, #FF1744 100%);
        }

        body {
            width: 420px;
            background: var(--dark-bg);
            font-family: 'Segoe UI', 'Google Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--text-primary);
            overflow-x: hidden;
        }

        /* ════════════════════════════════════════════════════════════ */
        /* HEADER & BRANDING                                            */
        /* ════════════════════════════════════════════════════════════ */
        .header {
            background: linear-gradient(135deg, rgba(255, 107, 107, 0.1) 0%, rgba(255, 23, 68, 0.05) 100%);
            border-bottom: 1px solid var(--border);
            padding: 18px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(10px);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            font-size: 28px;
            animation: pulse-shield 2s infinite;
        }

        @keyframes pulse-shield {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .brand-text h1 {
            font-size: 18px;
            font-weight: 700;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .brand-text p {
            font-size: 10px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .status-badge {
            background: rgba(81, 207, 102, 0.2);
            border: 1px solid var(--success);
            color: var(--success);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
        }

        /* ════════════════════════════════════════════════════════════ */
        /* MAIN CONTENT                                                 */
        /* ════════════════════════════════════════════════════════════ */
        .container {
            padding: 20px;
            min-height: 400px;
            display: flex;
            flex-direction: column;
        }

        /* RISK DISPLAY CARD */
        .risk-card {
            background: linear-gradient(135deg, var(--card-bg) 0%, rgba(255, 23, 68, 0.08) 100%);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 28px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .risk-card:hover {
            border-color: var(--primary);
            box-shadow: 0 12px 48px rgba(255, 107, 107, 0.15);
        }

        .risk-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-secondary);
            margin-bottom: 16px;
            font-weight: 600;
        }

        .risk-display {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            margin-bottom: 24px;
        }

        .risk-info {
            flex: 1;
        }

        .risk-emoji {
            font-size: 56px;
            animation: bounce 2s infinite;
            margin-bottom: 12px;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .risk-level {
            font-size: 32px;
            font-weight: 700;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .risk-level.safe {
            background: linear-gradient(135deg, var(--success) 0%, #45B649 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .risk-level.suspicious {
            background: linear-gradient(135deg, var(--warning) 0%, #FFC107 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .risk-level.high-risk {
            background: linear-gradient(135deg, #FFA500 0%, #FF6B6B 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .risk-level.critical {
            background: linear-gradient(135deg, var(--danger) 0%, #C41C3B 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .risk-score-display {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .risk-score-circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: 800;
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, rgba(255, 107, 107, 0.2) 0%, rgba(255, 23, 68, 0.1) 100%);
            border: 2px solid var(--primary);
            box-shadow: 0 4px 16px rgba(255, 107, 107, 0.2);
        }

        .risk-score-circle.safe {
            background: linear-gradient(135deg, rgba(81, 207, 102, 0.2) 0%, rgba(69, 182, 73, 0.1) 100%);
            border-color: var(--success);
            box-shadow: 0 4px 16px rgba(81, 207, 102, 0.2);
        }

        .risk-score-circle.suspicious {
            background: linear-gradient(135deg, rgba(255, 217, 61, 0.2) 0%, rgba(255, 193, 7, 0.1) 100%);
            border-color: var(--warning);
            box-shadow: 0 4px 16px rgba(255, 217, 61, 0.2);
        }

        .risk-score-circle.high-risk {
            background: linear-gradient(135deg, rgba(255, 165, 0, 0.2) 0%, rgba(255, 107, 107, 0.1) 100%);
            border-color: #FFA500;
            box-shadow: 0 4px 16px rgba(255, 165, 0, 0.2);
        }

        .risk-score-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
            font-weight: 600;
        }

        /* RISK GAUGE */
        .gauge-container {
            margin: 24px 0;
        }

        .gauge-bar {
            width: 100%;
            height: 10px;
            background: linear-gradient(90deg, 
                var(--success) 0%, 
                var(--warning) 33%, 
                #FFA500 66%, 
                var(--danger) 100%);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 12px rgba(255, 107, 107, 0.2);
            position: relative;
        }

        .gauge-indicator {
            position: absolute;
            width: 4px;
            height: 100%;
            background: var(--text-primary);
            top: 0;
            border-radius: 2px;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.6);
            transition: left 0.3s ease;
        }

        .gauge-labels {
            display: flex;
            justify-content: space-between;
            margin-top: 12px;
            font-size: 10px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        /* DETAILS SECTION */
        .details-section {
            background: rgba(255, 107, 107, 0.05);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            margin-top: 20px;
            backdrop-filter: blur(5px);
        }

        .section-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-secondary);
            margin-bottom: 14px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .reason-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.03);
            border-left: 3px solid var(--primary);
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 12px;
            line-height: 1.5;
            transition: all 0.2s ease;
        }

        .reason-item:last-child {
            margin-bottom: 0;
        }

        .reason-item:hover {
            background: rgba(255, 107, 107, 0.1);
            transform: translateX(4px);
        }

        .reason-icon {
            font-size: 14px;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .reason-text {
            color: var(--text-secondary);
        }

        .reasons-list {
            max-height: 220px;
            overflow-y: auto;
        }

        .reasons-list::-webkit-scrollbar {
            width: 4px;
        }

        .reasons-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .reasons-list::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 2px;
        }

        /* METADATA */
        .metadata {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 18px;
            font-size: 12px;
        }

        .metadata-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            transition: all 0.2s ease;
        }

        .metadata-item:hover {
            background: rgba(255, 107, 107, 0.08);
            border-color: var(--primary);
        }

        .metadata-label {
            color: var(--text-secondary);
            font-size: 9px;
            text-transform: uppercase;
            margin-bottom: 6px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .metadata-value {
            color: var(--text-primary);
            font-weight: 600;
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }

        /* ════════════════════════════════════════════════════════════ */
        /* LOADING STATE                                                */
        /* ════════════════════════════════════════════════════════════ */
        .scanning {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: var(--text-secondary);
            font-size: 14px;
            flex: 1;
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid var(--border);
            border-top: 2px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ════════════════════════════════════════════════════════════ */
        /* EMPTY STATE                                                  */
        /* ════════════════════════════════════════════════════════════ */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
        }

        .empty-icon {
            font-size: 56px;
            margin-bottom: 16px;
            opacity: 0.6;
        }

        .empty-text {
            font-size: 14px;
            line-height: 1.6;
        }

        .empty-subtext {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 8px;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="brand">
            <div class="brand-icon">🛡️</div>
            <div class="brand-text">
                <h1>ScamShield</h1>
                <p>AI Protected</p>
            </div>
        </div>
        <div class="status-badge">Active</div>
    </div>

    <div class="container">
        <div class="risk-card">
            <div class="risk-label">🎯 Phishing Risk Assessment</div>
            
            <!-- SCANNING STATE -->
            <div id="scanningState" class="scanning" style="display: none;">
                <div class="spinner"></div>
                <span>Analyzing URL...</span>
            </div>

            <!-- RISK CONTENT -->
            <div id="riskContent" style="display: none;">
                <div class="risk-display">
                    <div class="risk-info">
                        <div class="risk-emoji" id="riskEmoji">❓</div>
                        <div class="risk-level" id="riskLevel">Scanning</div>
                    </div>
                    <div class="risk-score-display">
                        <div class="risk-score-circle" id="riskScoreCircle">
                            <span id="riskScore">--</span>
                        </div>
                        <div class="risk-score-label">Risk Score</div>
                    </div>
                </div>

                <div class="gauge-container">
                    <div class="gauge-bar">
                        <div class="gauge-indicator" id="gaugeIndicator" style="left: 0%"></div>
                    </div>
                    <div class="gauge-labels">
                        <span>Safe</span>
                        <span>Suspicious</span>
                        <span>High Risk</span>
                        <span>Dangerous</span>
                    </div>
                </div>

                <div id="detailsContainer" class="details-section" style="display: none;">
                    <div class="section-title">
                        <span>🔍</span> Detection Signals
                    </div>
                    <div class="reasons-list" id="reasonsList"></div>
                </div>

                <div class="metadata">
                    <div class="metadata-item">
                        <div class="metadata-label">⏱️ Scan Time</div>
                        <div class="metadata-value" id="scanTime">--ms</div>
                    </div>
                    <div class="metadata-item">
                        <div class="metadata-label">🤖 Engine</div>
                        <div class="metadata-value" id="modelVersion">v2</div>
                    </div>
                </div>
            </div>

            <!-- EMPTY STATE -->
            <div id="emptyState" class="empty-state" style="display: none;">
                <div class="empty-icon">📄</div>
                <div class="empty-text">No active scan available</div>
                <div class="empty-subtext">Visit a website to analyze its security</div>
            </div>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
